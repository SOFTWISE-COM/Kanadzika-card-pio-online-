<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#003f43">
<title>Kanandzika Lanchonete Premium</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kanandzika">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root{--sab:env(safe-area-inset-bottom,0px)}
@media (display-mode:standalone),(display-mode:fullscreen){:root{--sab:max(env(safe-area-inset-bottom,0px),24px)}}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#003f43;
  --bg2:#005b60;
  --cyan:#08e7ee;
  --white:#fff;
  --muted:rgba(255,255,255,.68);
  --line:rgba(8,231,238,.65);
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  position:fixed;
  inset:0;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.screen{
  position:absolute;
  inset:0;
  width:100%;
  height:100dvh;
  display:none;
  overflow:hidden;
}

.screen.active{
  display:flex;
}


/* SPLASH */

#splash{
  background:
    radial-gradient(circle at 50% 35%,#08777a 0%,#005b60 35%,#003c40 100%);
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.splash-logo{
  width:170px;
  height:170px;
  border-radius:50%;
  object-fit:cover;
  box-shadow:
    0 0 0 8px rgba(8,231,238,.06),
    0 0 45px rgba(8,231,238,.4);
}

.progress-area{
  width:74%;
  max-width:310px;
  margin-top:32px;
  text-align:center;
}

.progress{
  position:relative;
  width:100%;
  height:9px;
  padding:2px;
  border-radius:20px;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.12);
  overflow:hidden;
  box-shadow:
    inset 0 1px 4px rgba(0,0,0,.35),
    0 0 15px rgba(8,231,238,.08);
}

.progress-bar{
  position:relative;
  width:0%;
  height:100%;
  border-radius:20px;
  background:linear-gradient(
    90deg,
    #04cbd3,
    #08e7ee,
    #8fffff
  );
  box-shadow:
    0 0 8px rgba(8,231,238,.8),
    0 0 18px rgba(8,231,238,.45);
  transition:width .08s linear;
}

.progress-bar::after{
  content:"";
  position:absolute;
  top:0;
  left:-35px;
  width:35px;
  height:100%;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.75),
    transparent
  );
  animation:shine 1.2s linear infinite;
}

@keyframes shine{
  from{left:-35px}
  to{left:100%}
}

.percent{
  margin-top:11px;
  font-size:13px;
  font-weight:700;
  letter-spacing:.5px;
  color:#dfffff;
}

.version{
  position:absolute;
  bottom:calc(16px + var(--sab));
  font-size:11px;
  color:rgba(255,255,255,.55);
}


/* INTRO */

#intro{
  background:#00484c;
}

.intro-image{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.intro-button{
  position:absolute;
  left:50%;
  bottom:calc(95px + var(--sab));
  transform:translateX(-50%);
  width:82%;
  max-width:360px;
  height:52px;
  border:0;
  border-radius:28px;
  background:var(--cyan);
  color:#003b3e;
  font-size:17px;
  font-weight:700;
  box-shadow:
    0 8px 25px rgba(0,0,0,.3),
    0 0 20px rgba(8,231,238,.25);
  z-index:5;
}

.intro-button:active{
  transform:translateX(-50%) scale(.97);
}

.dots{
  position:absolute;
  left:50%;
  bottom:calc(164px + var(--sab));
  transform:translateX(-50%);
  display:flex;
  gap:9px;
  z-index:5;
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:rgba(255,255,255,.32);
  transition:.25s;
}

.dot.active{
  width:24px;
  border-radius:10px;
  background:var(--cyan);
  box-shadow:0 0 10px rgba(8,231,238,.7);
}


/* LOGIN */

#login{
  background:#003f43;
}

.login-bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.login-overlay{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      to bottom,
      rgba(0,45,48,.08),
      rgba(0,63,67,.52) 42%,
      #003f43 100%
    );
}

.login-logo{
  position:absolute;
  top:5%;
  left:50%;
  transform:translateX(-50%);
  width:100px;
  height:100px;
  border-radius:50%;
  object-fit:cover;
  z-index:2;
}

.auth-card{
  position:absolute;
  top:51%;
  left:50%;
  transform:translate(-50%,-50%);
  width:90%;
  max-width:430px;
  max-height:calc(
    100dvh -
    35px -
    env(safe-area-inset-top) -
    var(--sab)
  );
  padding:25px 20px;
  border-radius:28px;
  background:rgba(0,48,51,.95);
  border:1px solid var(--line);
  box-shadow:0 18px 45px rgba(0,0,0,.28);
  z-index:3;
  overflow:hidden;
}

.auth-title{
  font-size:27px;
  font-weight:700;
  margin-bottom:5px;
}

.auth-subtitle{
  color:var(--muted);
  font-size:14px;
  margin-bottom:18px;
}

.field{
  height:58px;
  border:1.5px solid var(--cyan);
  border-radius:17px;
  display:flex;
  align-items:center;
  padding:0 14px;
  margin-bottom:13px;
  background:rgba(0,20,22,.2);
}

.field-icon{
  width:24px;
  height:24px;
  margin-right:12px;
  flex:none;
  color:#fff;
}

.field-icon svg{
  width:100%;
  height:100%;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.field input{
  width:100%;
  height:100%;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  font-size:15px;
}

.field input::placeholder{
  color:rgba(255,255,255,.58);
}

.password-button{
  width:25px;
  height:25px;
  border:0;
  background:none;
  color:#fff;
  flex:none;
  padding:2px;
}

.password-button svg{
  width:100%;
  height:100%;
  stroke:currentColor;
  fill:none;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.forgot{
  text-align:right;
  color:var(--cyan);
  font-size:13px;
  margin:1px 3px 17px;
}

.main-button{
  width:100%;
  height:54px;
  border:0;
  border-radius:28px;
  background:var(--cyan);
  color:#003c40;
  font-size:17px;
  font-weight:700;
  box-shadow:0 7px 20px rgba(8,231,238,.18);
}

.switch{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  margin-top:18px;
  font-size:14px;
}

.switch-action{
  border:0;
  background:none;
  color:var(--cyan);
  font-weight:700;
  padding:0;
}

.terms{
  display:flex;
  align-items:flex-start;
  gap:9px;
  margin:3px 2px 16px;
  font-size:11px;
  line-height:1.4;
  color:var(--muted);
}

.terms input{
  appearance:none;
  width:18px;
  height:18px;
  flex:none;
  border:1.5px solid var(--cyan);
  border-radius:4px;
  position:relative;
}

.terms input:checked{
  background:var(--cyan);
}

.terms input:checked::after{
  content:"";
  position:absolute;
  width:5px;
  height:9px;
  border-right:2px solid #003c40;
  border-bottom:2px solid #003c40;
  transform:rotate(45deg);
  left:5px;
  top:2px;
}

.terms a{
  color:var(--cyan);
}

.hidden{
  display:none;
}


/* HOME */

#home{
  background:
    radial-gradient(
      circle at 50% 0%,
      #086f73,
      #003f43 48%
    );
  flex-direction:column;
}

.home-top{
  width:100%;
  padding:
    calc(18px + env(safe-area-inset-top))
    18px
    12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.profile{
  display:flex;
  align-items:center;
  gap:11px;
}

.profile-photo{
  width:43px;
  height:43px;
  border-radius:50%;
  background:#08777a;
  border:2px solid rgba(8,231,238,.7);
  display:flex;
  align-items:center;
  justify-content:center;
}

.profile-photo svg{
  width:23px;
  height:23px;
  stroke:#fff;
  fill:none;
  stroke-width:1.7;
}

.profile-text small{
  display:block;
  color:var(--muted);
  font-size:11px;
}

.profile-text strong{
  display:block;
  margin-top:2px;
  font-size:15px;
}

.notification{
  width:43px;
  height:43px;
  border-radius:50%;
  border:1px solid rgba(8,231,238,.45);
  background:rgba(0,35,38,.45);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}

.notification svg{
  width:22px;
  height:22px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.7;
}

.home-brand{
  text-align:center;
  padding:15px 20px 10px;
}

.home-brand img{
  width:125px;
  height:125px;
  object-fit:cover;
  border-radius:50%;
}

.home-brand h1{
  font-size:20px;
  margin-top:6px;
}

.home-brand p{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.home-actions{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  width:90%;
  max-width:430px;
  margin:20px auto;
}

.home-card{
  min-height:115px;
  padding:18px;
  border-radius:22px;
  background:rgba(0,48,51,.82);
  border:1px solid rgba(8,231,238,.32);
  color:#fff;
  text-align:left;
}

.home-card svg{
  width:28px;
  height:28px;
  stroke:var(--cyan);
  fill:none;
  stroke-width:1.7;
  margin-bottom:13px;
}

.home-card strong{
  display:block;
  font-size:15px;
}

.home-card span{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.home-bottom{
  position:absolute;
  left:0;
  bottom:var(--sab);
  width:100%;
  height:65px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  background:rgba(0,42,45,.97);
  border-top:1px solid rgba(8,231,238,.2);
}

.nav-item{
  border:0;
  background:none;
  color:rgba(255,255,255,.55);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  font-size:10px;
}

.nav-item.active{
  color:var(--cyan);
}

.nav-item svg{
  width:22px;
  height:22px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.7;
}


/* MOBILE */

@media(max-height:700px){

  .splash-logo{
    width:135px;
    height:135px;
  }

  .progress-area{
    margin-top:22px;
  }

  .intro-button{
    bottom:calc(78px + var(--sab));
  }

  .dots{
    bottom:calc(140px + var(--sab));
  }

  .login-logo{
    width:82px;
    height:82px;
    top:3%;
  }

  .auth-card{
    top:53%;
    padding:17px 16px;
  }

  .auth-title{
    font-size:23px;
  }

  .auth-subtitle{
    margin-bottom:11px;
  }

  .field{
    height:47px;
    margin-bottom:8px;
  }

  .forgot{
    margin-bottom:10px;
  }

  .main-button{
    height:48px;
  }

  .switch{
    margin-top:11px;
  }

  .terms{
    margin-bottom:10px;
  }

  .home-brand{
    padding-top:5px;
  }

  .home-brand img{
    width:90px;
    height:90px;
  }
}

/* INSTALAR APP / AVISOS */
.install-btn{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(30px + var(--sab));
  width:82%;max-width:360px;height:46px;border-radius:26px;
  border:1.5px solid var(--cyan);background:rgba(0,48,51,.85);
  color:#fff;font-size:15px;font-weight:700;z-index:6;
}
#splash .install-btn{bottom:calc(52px + var(--sab))}
.install-btn.hidden{display:none}
.toast{
  position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top));
  transform:translate(-50%,-30px);opacity:0;pointer-events:none;
  width:90%;max-width:400px;padding:13px 16px;border-radius:16px;
  background:rgba(0,48,51,.98);border:1px solid var(--cyan);
  color:#fff;font-size:14px;text-align:center;z-index:99;transition:.3s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foto-pick{display:flex;flex-direction:column;align-items:center;gap:8px;margin:2px 0 14px}
.foto-btn{position:relative;width:92px;height:92px;border-radius:50%;border:2px dashed var(--cyan,#00e5ff);background:rgba(0,229,255,.08);color:#9bb7ba;display:grid;place-items:center;overflow:hidden;padding:0;cursor:pointer}
.foto-btn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.foto-btn.ok{border-style:solid}
.foto-btn.ok img{display:block}
.foto-btn svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.foto-btn.ok svg{display:none}
.foto-cam{position:absolute;right:-2px;bottom:-2px}
.foto-hint{font-size:12px;color:#9bb7ba;text-align:center}
</style>
<script>
/* Garante que os botões ficam acima da barra de navegação do telemóvel */
(function(){
  function fit(){
    try{
      var st=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;
      var probe=document.createElement('div');
      probe.style.cssText='position:fixed;left:0;bottom:0;width:0;height:env(safe-area-inset-bottom,0px);visibility:hidden';
      document.documentElement.appendChild(probe);
      var env=probe.getBoundingClientRect().height||0;probe.remove();
      var h=window.innerHeight,sh=window.screen.height;
      var cobre=Math.abs(h-sh)<=2||Math.abs(h-window.screen.availHeight)<=2&&sh-h<2;
      var v=env;
      if(st){v=Math.max(env,cobre?48:24);}       /* app instalado: sobe pelo menos 24 px (48 px se o ecrã cobrir a barra) */
      else if(env<8){v=Math.max(env,8);}          /* navegador: pequena folga */
      document.documentElement.style.setProperty('--sab',v+'px');
    }catch(e){}
  }
  fit();
  window.addEventListener('resize',fit);
  window.addEventListener('orientationchange',function(){setTimeout(fit,300);});
  window.addEventListener('load',fit);
})();
</script>
</head>

<body>


<!-- SPLASH -->

<section id="splash" class="screen active">

  <img
    src="assets/logo.png"
    class="splash-logo"
    alt="Kanandzika">

  <div class="progress-area">

    <div class="progress">
      <div
        id="progressBar"
        class="progress-bar">
      </div>
    </div>

    <div
      id="percent"
      class="percent">
      0%
    </div>

  </div>

  <button class="install-btn" onclick="installApp()" style="display:flex;align-items:center;justify-content:center">
       
  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3v12"/>
    <path d="m7 10 5 5 5-5"/>
    <path d="M5 21h14"/>
  </svg>
  <span style="margin-left:8px">Instalar app</span>
</button>
  <div class="version">
    Versão 1.0.0
  </div>

</section>


<!-- INTRO -->

<section id="intro" class="screen">

  <img
    id="introImage"
    class="intro-image"
    src="assets/intro1.png"
    alt="Kanandzika">

  <div class="dots">
    <span class="dot active"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>

  <button
    id="nextButton"
    class="intro-button">
    Próximo<svg viewBox="0 0 24 24" width="18" height="18" style="vertical-align:-3px;margin-left:6px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </button>

  <button class="install-btn" onclick="installApp()" style="display:flex;align-items:center;justify-content:center">
  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3v12"/>
    <path d="m7 10 5 5 5-5"/>
    <path d="M5 21h14"/>
  </svg>
  <span style="margin-left:8px">Instalar app</span>
</button>

</section>


<!-- LOGIN / CADASTRO -->

<section id="login" class="screen">

  <img
    src="assets/intro3.png"
    class="login-bg"
    alt="Kanandzika">

  <div class="login-overlay"></div>

  <img
    src="assets/logo.png"
    class="login-logo"
    alt="Kanandzika">


  <div class="auth-card">

    <!-- LOGIN -->

    <div id="loginForm">

      <div class="auth-title">
        Entrar
      </div>

      <div class="auth-subtitle">
        Acesse a sua conta Kanandzika
      </div>


      <div class="field">

        <div class="field-icon">
          <svg viewBox="0 0 24 24">
            <rect x="6" y="2.5" width="12" height="19" rx="2"/>
            <path d="M10 18h4"/>
          </svg>
        </div>

        <input
          id="loginPhone"
          type="tel"
          placeholder="Número de telemóvel">

      </div>


      <div class="field">

        <div class="field-icon">
          <svg viewBox="0 0 24 24">
            <rect x="4" y="10" width="16" height="11" rx="2"/>
            <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
          </svg>
        </div>

        <input
          id="loginPassword"
          type="password"
          placeholder="Senha">

        <button
          class="password-button"
          onclick="togglePassword('loginPassword',this)">

          <svg viewBox="0 0 24 24">
            <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/>
            <circle cx="12" cy="12" r="2.5"/>
          </svg>

        </button>

      </div>


      <div class="forgot">
        Esqueceu a senha?
      </div>


      <button
        class="main-button"
        onclick="doLogin()">
        Entrar<svg class="ico" viewBox="0 0 24 24" style="width:18px;height:18px;vertical-align:-3px;margin-left:6px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>


      <div class="switch">
        <span>Não tem uma conta?</span>

        <button
          class="switch-action"
          onclick="showRegister()">
          Cadastre-se<svg class="ico" viewBox="0 0 24 24" style="width:18px;height:18px;vertical-align:-3px;margin-left:6px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>

    </div>


    <!-- CADASTRO -->

    <div id="registerForm" class="hidden">

      <div class="auth-title">
        Cadastro
      </div>

      <div class="auth-subtitle">
        Crie a sua conta Kanandzika
      </div>

      <div class="foto-pick">
        <button type="button" class="foto-btn" id="fotoBtn" onclick="document.getElementById('fotoInput').click()" aria-label="Escolher foto de perfil">
          <img id="fotoImg" alt="">
          <svg viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13.5" r="3.5"/></svg>
        </button>
        <input id="fotoInput" type="file" accept="image/*" hidden>
        <span class="foto-hint" id="fotoHint">Toque para escolher a sua foto de perfil</span>
      </div>


      <div class="field">

        <div class="field-icon">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="7" r="4"/>
            <path d="M4 21a8 8 0 0 1 16 0"/>
          </svg>
        </div>

        <input
          id="registerName"
          type="text"
          placeholder="Nome completo">

      </div>


      <div class="field">

        </div>

        <input
          id="registerPassword"
          type="password"
          placeholder="Senha">

        <button
          class="password-button"
          onclick="togglePassword('registerPassword',this)">

          <svg viewBox="0 0 24 24">
            <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/>
            <circle cx="12" cy="12" r="2.5"/>
          </svg>

        </button>

      <div class="field">

        <div class="field-icon">
          <svg viewBox="0 0 24 24">
            <rect x="4" y="10" width="16" height="11" rx="2"/>
            <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
          </svg>
        </div>

        <input
          id="confirmPassword"

          placeholder="Confirmar senha">

      </div>


      <label class="terms">

        <input id="terms" type="checkbox">

        <span>
          Li e aceito os
          <a href="#">Termos de Uso</a>

        </span>

      </label>


      <button
        class="main-button"
        onclick="doRegister()">
        Cadastrar<svg class="ico" viewBox="0 0 24 24" style="width:18px;height:18px;vertical-align:-3px;margin-left:6px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>


      <div class="switch">

        <span>Já tem uma conta?</span>

        <button
          class="switch-action"
          onclick="showLogin()">
          Entrar<svg class="ico" viewBox="0 0 24 24" style="width:18px;height:18px;vertical-align:-3px;margin-left:6px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>

<div id="toast" class="toast"></div>

<script src="foto.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

/* SPLASH */

const splash=document.getElementById("splash");
const intro=document.getElementById("intro");
const login=document.getElementById("login");

const progressBar=document.getElementById("progressBar");
const percent=document.getElementById("percent");

let progress=0;

const timer=setInterval(()=>{

  progress++;

  progressBar.style.width=progress+"%";
  percent.textContent=progress+"%";

  if(progress>=100){

    clearInterval(timer);

    setTimeout(()=>{

      if(localStorage.getItem("kz_session")&&localStorage.getItem("kz_user")){location.replace("home.html");return;}

      splash.classList.remove("active");
      intro.classList.add("active");

    },250);

  }

},80);


/* INTRO */

const images=[
  "assets/intro1.png",
  "assets/intro2.png",
  "assets/intro3.png"
];

let current=0;

const introImage=document.getElementById("introImage");
const nextButton=document.getElementById("nextButton");
const dots=document.querySelectorAll(".dot");

nextButton.addEventListener("click",()=>{

  current++;

  if(current<images.length){

    introImage.src=images[current];

    dots.forEach((dot,index)=>{

      dot.classList.toggle(
        "active",
        index===current
      );

    });

    if(current===images.length-1){
      nextButton.innerHTML="Começar"+'<svg viewBox="0 0 24 24" width="18" height="18" style="vertical-align:-3px;margin-left:6px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
    }

  }else{

    intro.classList.remove("active");
    login.classList.add("active");

  }

});


/* SWITCH LOGIN */

function showLogin(){

  document.getElementById("registerForm")
    .classList.add("hidden");

  document.getElementById("loginForm")
    .classList.remove("hidden");

}


/* SWITCH CADASTRO */

function showRegister(){

  document.getElementById("loginForm")
    .classList.add("hidden");

  document.getElementById("registerForm")
    .classList.remove("hidden");

}


/* PASSWORD */

function togglePassword(id,button){

  const input=document.getElementById(id);

  input.type=
    input.type==="password"
    ? "text"
    : "password";

}


/* AVISOS */

function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;
  t.classList.add("show");
  clearTimeout(toast.t);
  toast.t=setTimeout(()=>t.classList.remove("show"),3200);
}

/* CADASTRO / LOGIN (dados guardados no aparelho) */

function normPhone(v){
  let d=String(v).replace(/\D/g,"");
  if(d.startsWith("258")&&d.length>9)d=d.slice(3);
  return d;
}

function goHome(){
  localStorage.setItem("kz_session","1");
  location.href="home.html";
}

const SUPABASE_URL='https://uuuibhgbwqlbylaijwuh.supabase.co';
const SUPABASE_KEY='sb_publishable_eqqZ031QjqiOsx8tcVqILg_bgHwVZ5y';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const phoneEmail=p=>p+'@kanandzika.app';
const $v=id=>document.getElementById(id).value;

let fotoSel=null;
document.getElementById("fotoInput").addEventListener("change",async function(e){
  const f=e.target.files&&e.target.files[0];if(!f)return;
  try{
    fotoSel=await Foto.preparar(f);
    document.getElementById("fotoImg").src=fotoSel.dataUrl;
    document.getElementById("fotoBtn").classList.add("ok");
    document.getElementById("fotoHint").textContent="Toque para trocar a foto";
  }catch(err){fotoSel=null;toast(err.message||"Não foi possível usar essa imagem.");}
});

async function doRegister(){
  const name=$v("registerName").trim();
  const phone=normPhone($v("registerPhone"));
  const pass=$v("registerPassword");
  if(name.length<2)return toast("Escreva o seu nome completo.");
  if(!/^\d{9}$/.test(phone))return toast("Número de telemóvel inválido (9 dígitos).");
  if(pass.length<6)return toast("A senha deve ter pelo menos 6 caracteres.");
  if(pass!==$v("confirmPassword"))return toast("As senhas não coincidem.");
  if(!fotoSel)return toast("Escolha a sua foto de perfil.");
  if(!document.getElementById("terms").checked)return toast("Aceite os Termos de Uso para continuar.");
  const {error}=await sb.auth.signUp({email:phoneEmail(phone),password:pass,options:{data:{name,phone}}});
  if(error)return toast(/registered|already/i.test(error.message)?"Este número já tem conta. Toque em Entrar.":"Erro: "+error.message);
  // envia a foto; se falhar agora, tenta outra vez dentro do app
  let avatar="";
  try{avatar=await Foto.enviar(sb,fotoSel.blob);}
  catch(e){try{localStorage.setItem("kz_avatar_pending","1");}catch(_){}}
  try{localStorage.setItem("kz_avatar",JSON.stringify(fotoSel.dataUrl));}catch(_){}
  localStorage.setItem("kz_user",JSON.stringify({name,phone,avatar}));
  goHome();
}

async function doLogin(){
  const phone=normPhone($v("loginPhone"));
  const pass=$v("loginPassword");
  const {data,error}=await sb.auth.signInWithPassword({email:phoneEmail(phone),password:pass});
  if(error)return toast("Número ou senha incorretos.");
  const name=(data.user.user_metadata&&data.user.user_metadata.name)||"Cliente";
  const avatar=(data.user.user_metadata&&data.user.user_metadata.avatar_url)||"";
  try{if(!avatar)localStorage.removeItem("kz_avatar");}catch(_){}
  localStorage.setItem("kz_user",JSON.stringify({name,phone,avatar}));
  goHome();
}

/* INSTALAR APP (PWA) */

let deferredPrompt=null;
const isStandalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;

window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;});
window.addEventListener("appinstalled",()=>{
  document.querySelectorAll(".install-btn").forEach(b=>b.classList.add("hidden"));
  toast("Aplicativo instalado!");
});
if(isStandalone)document.querySelectorAll(".install-btn").forEach(b=>b.classList.add("hidden"));

async function installApp(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt=null;
  }else if(/iphone|ipad|ipod/i.test(navigator.userAgent)){
    toast("No iPhone: toque em Partilhar e depois em Adicionar ao ecrã principal.");
  }else{
    toast("Abra o menu do navegador (⋮) e toque em Instalar aplicativo.");
  }
}

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}

</script>

</body>
</html>
